name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Scoped to production dependencies: the shipped static export must stay
      # advisory-free, while dev-only tooling advisories do not block. This step
      # consults the live advisory database, so it can turn red without any commit
      # changing — that is intended, and the fix is a dependency bump, not a revert.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check:version
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:full

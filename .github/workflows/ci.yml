name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only reads the checkout, it never writes back.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The shipped app and the build/test toolchain must both remain free of known
      # high-severity advisories. This live-registry gate may identify a newly
      # disclosed issue without a repository change; update the affected dependency.
      - run: pnpm audit --audit-level high
      - run: pnpm check:version
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:full

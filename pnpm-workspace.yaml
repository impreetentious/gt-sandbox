# Transitive-dependency pins, together holding `pnpm audit` at zero advisories.
# The range-selected entries force any vulnerable copy pulled in below the top
# level up to a patched release. The two bare entries pin a whole package
# instead: Next 16.2.x still resolves an old `postcss` inside its dependency
# tree and `sharp` arrives the same way, so both are pinned across the build
# pipeline — `postcss` at an advisory floor rather than merely a single version.
overrides:
  brace-expansion@<1.1.17: ^1.1.17
  brace-expansion@>=2.0.0 <2.1.3: ^2.1.3
  brace-expansion@>=4.0.0 <5.0.8: ^5.0.8
  fast-uri@>=3.0.0 <3.1.6: 3.1.6
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  nanoid@<3.3.18: ^3.3.18
  browserslist@<=4.28.6: 4.28.7
  postcss: ^8.5.23
  sharp: 0.35.4

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
